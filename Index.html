<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor de Aura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Medidor de Aura</h1>
        <p>Responda as perguntas abaixo para descobrir sua aura!</p>
        
        <form id="auraForm">
            <div class="question">
                <label for="name">Nome Completo:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="question">
                <label for="age">Idade:</label>
                <input type="number" id="age" name="age" required>
            </div>

            <div class="question">
                <label for="gender">Gênero:</label>
                <select id="gender" name="gender">
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="question">
                <label for="state">Estado que nasceu:</label>
                <input type="text" id="state" name="state" required>
            </div>

            <div class="question">
                <label for="city">Cidade que nasceu:</label>
                <input type="text" id="city" name="city" required>
            </div>

            <div class="question">
                <label for="team">Time brasileiro que torce:</label>
                <input type="text" id="team" name="team" required>
            </div>

            <div class="question">
                <label for="platform">Plataforma que usa para jogar jogos:</label>
                <select id="platform" name="platform">
                    <option value="pc">PC</option>
                    <option value="playstation">Playstation</option>
                    <option value="xbox">Xbox</option>
                    <option value="mobile">Mobile</option>
                </select>
            </div>

            <div class="question">
                <label for="games">Jogos que joga:</label>
                <input type="text" id="games" name="games" required>
            </div>

            <div class="question">
                <label for="spendMoney">Você gasta dinheiro com o jogo que joga?</label>
                <select id="spendMoney" name="spendMoney">
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
                </select>
            </div>

            <div class="question">
                <label for="yearsPlaying">Há quantos anos joga o jogo?</label>
                <input type="number" id="yearsPlaying" name="yearsPlaying" required>
            </div>

            <button type="button" onclick="calculateAura()">Calcular Aura</button>
        </form>

        <div id="result" class="result">
            <h2>Sua Aura:</h2>
            <p id="auraValue">Ainda não calculado...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
